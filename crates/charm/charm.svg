<svg xmlns="http://www.w3.org/2000/svg" width="720" height="484" viewBox="0 0 720 484">
  <!-- Charm's plain faceplate (ticket 0020): a grid of the params, enough to
       play it in a DAW, and the flock display (ticket 0019), which the
       engine's telemetry draws. 0019's real design replaces the rest. Each shape in the "controls" layer marks one
       control; its id is kind.name. -->
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2f3a"/>
      <stop offset="1" stop-color="#1b1e26"/>
    </linearGradient>
  </defs>
  <rect width="720" height="484" fill="#101217"/>
  <rect x="4" y="4" width="712" height="476" rx="6" fill="url(#panel)" stroke="#3b4050"/>
  <g font-family="'Jost*'" font-weight="500">
    <text x="24" y="38" font-size="22" letter-spacing="4" fill="#f1e9d2">CHARM</text>
    <text x="136" y="38" font-size="9" letter-spacing="2.6" fill="#d8b45a">ENSEMBLE CHORUS</text>
    <text x="696" y="38" font-size="8" letter-spacing="2.4" fill="#8a8f9c" text-anchor="end">VULPUS LABS</text>
    <line x1="24" y1="52" x2="696" y2="52" stroke="#3b4050" stroke-width="1"/>
  </g>
  <g font-family="'Jost*'" font-weight="500" font-size="9" letter-spacing="1.4" fill="#d9dbe2" text-anchor="middle">
    <text x="72" y="350">VOICES</text>
    <text x="168" y="350">DETUNE</text>
    <text x="264" y="350">SPREAD</text>
    <text x="360" y="350">COHESION</text>
    <text x="456" y="350">SEPARATION</text>
    <text x="552" y="350">TURBULENCE</text>
    <text x="648" y="350">MIX</text>
    <text x="72" y="464">WIDTH</text>
    <text x="168" y="464">AUTO WIDTH</text>
    <text x="264" y="464">LOW XOVER</text>
    <text x="360" y="464">MID DEPTH</text>
    <text x="456" y="464">HIGH DEPTH</text>
    <text x="552" y="464">DUCK</text>
    <text x="648" y="464">BLOOM</text>
  </g>
  <g fill="none" stroke="#565c6c" stroke-width="2">
    <circle cx="72" cy="302" r="34"/>
    <circle cx="168" cy="302" r="34"/>
    <circle cx="264" cy="302" r="34"/>
    <circle cx="360" cy="302" r="34"/>
    <circle cx="456" cy="302" r="34"/>
    <circle cx="552" cy="302" r="34"/>
    <circle cx="648" cy="302" r="34"/>
    <circle cx="72" cy="416" r="34"/>
    <rect x="142" y="400" width="52" height="32" rx="8"/>
    <circle cx="264" cy="416" r="34"/>
    <circle cx="360" cy="416" r="34"/>
    <circle cx="456" cy="416" r="34"/>
    <circle cx="552" cy="416" r="34"/>
    <circle cx="648" cy="416" r="34"/>
  </g>
  <rect x="23" y="65" width="674" height="174" rx="5" fill="#0b0d12" stroke="#3b4050"/>
  <g font-family="'Jost*'" font-weight="500" font-size="8" letter-spacing="1.6" fill="#8a8f9c">
    <text x="24" y="257">L</text>
    <text x="696" y="257" text-anchor="end">R</text>
    <text x="360" y="257" text-anchor="middle">FRONT</text>
    <circle cx="566" cy="254" r="3" fill="#e8be5e"/>
    <text x="574" y="257">MID</text>
    <circle cx="614" cy="254" r="3" fill="#6ccfd6"/>
    <text x="622" y="257">HIGH</text>
  </g>
  <g id="controls">
    <rect id="canvas.flock" x="24" y="66" width="672" height="172" fill="#ff00ff"/>
    <circle id="knob.voices" cx="72" cy="302" r="28" fill="#ff00ff"/>
    <circle id="knob.detune" cx="168" cy="302" r="28" fill="#ff00ff"/>
    <circle id="knob.spread" cx="264" cy="302" r="28" fill="#ff00ff"/>
    <circle id="knob.cohesion" cx="360" cy="302" r="28" fill="#ff00ff"/>
    <circle id="knob.separation" cx="456" cy="302" r="28" fill="#ff00ff"/>
    <circle id="knob.turbulence" cx="552" cy="302" r="28" fill="#ff00ff"/>
    <circle id="knob.mix" cx="648" cy="302" r="28" fill="#ff00ff"/>
    <circle id="knob.width" cx="72" cy="416" r="28" fill="#ff00ff"/>
    <rect id="toggle.auto_width" x="146" y="404" width="44" height="24" fill="#ff00ff"/>
    <circle id="knob.low_xover" cx="264" cy="416" r="28" fill="#ff00ff"/>
    <circle id="knob.mid_depth" cx="360" cy="416" r="28" fill="#ff00ff"/>
    <circle id="knob.high_depth" cx="456" cy="416" r="28" fill="#ff00ff"/>
    <circle id="knob.duck" cx="552" cy="416" r="28" fill="#ff00ff"/>
    <circle id="knob.bloom" cx="648" cy="416" r="28" fill="#ff00ff"/>
  </g>
</svg>
