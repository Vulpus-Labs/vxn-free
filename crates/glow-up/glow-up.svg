<svg xmlns="http://www.w3.org/2000/svg" width="720" height="436" viewBox="0 0 720 436">
  <!-- Glow-Up's plain faceplate (ticket 0010): a grid of the params, enough
       to play it in a DAW. Ticket 0009 replaces it with the real design.
       Each shape in the "controls" layer marks one control; its id is
       kind.name. Drawn from scratch. -->
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e2a33"/>
      <stop offset="1" stop-color="#1c1a21"/>
    </linearGradient>
  </defs>
  <rect width="720" height="436" fill="#110f14"/>
  <rect x="4" y="4" width="712" height="428" rx="6" fill="url(#panel)" stroke="#4a4452"/>
  <g font-family="'Jost*'" font-weight="500">
    <text x="24" y="38" font-size="22" letter-spacing="4" fill="#f4e8d8">GLOW-UP</text>
    <text x="160" y="38" font-size="9" letter-spacing="2.6" fill="#e0a85e">HARMONIC FILTER</text>
    <text x="696" y="38" font-size="8" letter-spacing="2.4" fill="#958d9c" text-anchor="end">VULPUS LABS</text>
    <line x1="24" y1="52" x2="696" y2="52" stroke="#4a4452" stroke-width="1"/>
  </g>
  <rect x="24" y="68" width="288" height="128" rx="5" fill="none" stroke="#4a4452"/>
  <rect x="408" y="68" width="288" height="128" rx="5" fill="none" stroke="#4a4452"/>
  <g font-family="'Jost*'" font-weight="500" font-size="16" letter-spacing="2" fill="#e0a85e" text-anchor="middle">
    <text x="360" y="124">A</text>
    <text x="360" y="148" font-size="8" letter-spacing="1.6" fill="#958d9c">N / D × PEAK</text>
    <text x="360" y="172">B</text>
  </g>
  <g font-family="'Jost*'" font-weight="500" font-size="9" letter-spacing="1.4" fill="#ddd8e2" text-anchor="middle">
    <text x="72" y="176">A AMOUNT</text>
    <text x="168" y="176">A NUM</text>
    <text x="264" y="176">A DEN</text>
    <text x="456" y="176">B AMOUNT</text>
    <text x="552" y="176">B NUM</text>
    <text x="648" y="176">B DEN</text>
    <text x="72" y="298">WIDTH</text>
    <text x="168" y="298">RESONANCE</text>
    <text x="264" y="298">FOCUS</text>
    <text x="360" y="298">MIX</text>
    <text x="456" y="298">THRESHOLD</text>
    <text x="552" y="298">TONE</text>
    <text x="648" y="298">SPEED</text>
    <text x="72" y="420">WINDOW</text>
    <text x="216" y="420">GRID</text>
    <text x="408" y="420">MODE</text>
    <text x="600" y="420">DRY CUT</text>
  </g>
  <g fill="none" stroke="#5c5666" stroke-width="2">
    <circle cx="72" cy="128" r="34"/>
    <circle cx="168" cy="128" r="34"/>
    <circle cx="264" cy="128" r="34"/>
    <circle cx="456" cy="128" r="34"/>
    <circle cx="552" cy="128" r="34"/>
    <circle cx="648" cy="128" r="34"/>
    <circle cx="72" cy="250" r="34"/>
    <circle cx="168" cy="250" r="34"/>
    <circle cx="264" cy="250" r="34"/>
    <circle cx="360" cy="250" r="34"/>
    <circle cx="456" cy="250" r="34"/>
    <circle cx="552" cy="250" r="34"/>
    <circle cx="648" cy="250" r="34"/>
    <circle cx="72" cy="372" r="34"/>
    <rect x="153" y="357" width="126" height="30" rx="8"/>
    <rect x="355" y="357" width="106" height="30" rx="8"/>
    <rect x="574" y="356" width="52" height="32" rx="8"/>
  </g>
  <g id="controls">
    <circle id="knob.a_amount" cx="72" cy="128" r="28" fill="#ff00ff"/>
    <circle id="knob.a_num" cx="168" cy="128" r="28" fill="#ff00ff"/>
    <circle id="knob.a_den" cx="264" cy="128" r="28" fill="#ff00ff"/>
    <circle id="knob.b_amount" cx="456" cy="128" r="28" fill="#ff00ff"/>
    <circle id="knob.b_num" cx="552" cy="128" r="28" fill="#ff00ff"/>
    <circle id="knob.b_den" cx="648" cy="128" r="28" fill="#ff00ff"/>
    <circle id="knob.width" cx="72" cy="250" r="28" fill="#ff00ff"/>
    <circle id="knob.resonance" cx="168" cy="250" r="28" fill="#ff00ff"/>
    <circle id="knob.focus" cx="264" cy="250" r="28" fill="#ff00ff"/>
    <circle id="knob.mix" cx="360" cy="250" r="28" fill="#ff00ff"/>
    <circle id="knob.threshold" cx="456" cy="250" r="28" fill="#ff00ff"/>
    <circle id="knob.tone" cx="552" cy="250" r="28" fill="#ff00ff"/>
    <circle id="knob.speed" cx="648" cy="250" r="28" fill="#ff00ff"/>
    <circle id="knob.window" cx="72" cy="372" r="28" fill="#ff00ff"/>
    <rect id="selector.grid" x="156" y="360" width="120" height="24" fill="#ff00ff"/>
    <rect id="selector.mode" x="358" y="360" width="100" height="24" fill="#ff00ff"/>
    <rect id="toggle.dry_cut" x="578" y="360" width="44" height="24" fill="#ff00ff"/>
  </g>
</svg>
