[package]
name = "glow-up-clap"
description = "Glow-Up as a CLAP audio effect"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
glow-up.workspace = true
silkscreen.workspace = true
silkscreen-clap.workspace = true

[build-dependencies]
silkscreen-build.workspace = true

[dev-dependencies]
vxn-free-dsp.workspace = true
silkscreen-bridge = { workspace = true, features = ["testing"] }
silkscreen-clap = { workspace = true, features = ["test-host"] }
clack-host = { workspace = true, features = ["clack-plugin"] }
clack-plugin.workspace = true
clack-extensions = { workspace = true, features = ["audio-ports", "params", "state", "latency", "clack-plugin", "clack-host"] }

# How `cargo silkscreen bundle` wraps it. `id` and `name` match the
# plugin's `ID` and `NAME` in src/lib.rs.
[package.metadata.silkscreen.clap]
bundle = "Glow-Up"
id = "labs.vulpus.glow-up"
name = "Glow-Up"

[lints]
workspace = true
